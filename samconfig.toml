version = 0.1

[default.global.parameters]
stack_name = "bgg-agent"       # TODO: set your CloudFormation stack name
region = "us-east-1"           # TODO: set your AWS region

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
# Pass parameter values at deploy time:
#   sam deploy --parameter-overrides "SessionsTable=YOUR_TABLE AnthropicApiKey=YOUR_KEY"
# Or set them here (avoid committing secrets):
# parameter_overrides = "SessionsTable=bgg-sessions"
